<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10232A"/>
      <stop offset="100%" style="stop-color:#1e2d33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a07d"/>
      <stop offset="100%" style="stop-color:#B58863"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  
  <!-- Border accent -->
  <rect x="3" y="3" width="94" height="94" rx="17" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  
  <!-- VJ Monogram -->
  <text x="50" y="68" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="700" fill="url(#accent)" text-anchor="middle" letter-spacing="-3">VJ</text>
</svg>

